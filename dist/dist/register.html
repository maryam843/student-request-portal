<!DOCTYPE html>
<html lang="en">

<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>CoreUI Free Bootstrap Admin Template</title>
  <link rel="stylesheet" href="vendors/simplebar/css/simplebar.css">
  <link rel="stylesheet" href="css/vendors/simplebar.css">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/examples.css" rel="stylesheet">
</head>

<body>
  <div class="bg-light min-vh-100 d-flex flex-row align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card mb-4 mx-4">
            <div class="card-body p-4">
              <h1>Register</h1>
              <p class="text-medium-emphasis">Create your account</p>
              <form action="/register" method="POST" enctype="multipart/form-data">

                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <svg class="icon">
                      <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-user"></use>
                    </svg>
                  </span>
                  <input class="form-control" type="text" name="name" placeholder="Username" required>
                </div>

                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <img src="vendors/@coreui/icons/svg/account-management-icon-29.png" alt="Account Icon" width="20" height="20">
                  </span>
                  <select class="form-control" name="accountType" required>
                    <option value="" disabled selected hidden>Select Account Type</option>
                    <option value="student">Student</option>
                    <option value="department_head">Department Head</option>
                  </select>                  
                </div>
                
                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <svg class="icon">
                      <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-envelope-open"></use>
                    </svg>
                  </span>
                  <input class="form-control" type="email" name="email" placeholder="Email" required>
                </div>

                <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/college.jpeg" alt="Account Icon" width="20"
                          height="20">
                  </span>
                  <select class="form-control" name="college" required>
                      <option value="" disabled selected hidden>Select College</option>
                      <option value="Business">Business</option>
                      <option value="IT">Computing and IT</option>
                      <option value="Engineering">Engineering</option>
                      <option value="General Education">General Education</option>
                      <option value="Health">Health Science</option>
                  </select>
              </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/dob.jpeg" alt="Account Icon" width="20"
                          height="20">
                  </span>
                  <input class="form-control" type="date" name="dob" placeholder="DOB" required>
              </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/age.jpeg" alt="Account Icon" width="20"
                          height="20">
                  </span>
                  <input class="form-control" type="text"  name="ID" placeholder="ID" required pattern="\d+" title="Only numbers allowed" required>
                </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/nationality.jpeg" alt="Account Icon"
                          width="20" height="20">
                  </span>
                  <input class="form-control" type="text" name="nationality" placeholder="Nationality"
                      required>
              </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/address.jpeg" alt="Account Icon" width="20"
                          height="20">
                  </span>
                  <input class="form-control" type="text" name="address" placeholder="Address"
                      required>
              </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/phone.jpeg" alt="Account Icon" width="20"
                          height="20">
                  </span>
                  <input class="form-control" type="tel" name="phone" placeholder="Phone" required>
              </div>

              <div class="input-group mb-3">
                  <span class="input-group-text">
                      <img src="vendors/@coreui/icons/svg/profile.png" alt="Upload Pic" width="20"
                          height="20">
                  </span>
                  <input class="form-control" type="file" name="profilePic" accept="image/*" required>
              </div>

                <div class="input-group mb-3">
                  <span class="input-group-text">
                    <svg class="icon">
                      <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-lock-locked"></use>
                    </svg>
                  </span>
                  <input class="form-control" type="password" name="password" placeholder="Password" required>
                </div>

                <div class="input-group mb-4">
                  <span class="input-group-text">
                    <svg class="icon">
                      <use xlink:href="vendors/@coreui/icons/svg/free.svg#cil-lock-locked"></use>
                    </svg>
                  </span>
                  <input class="form-control" type="password" name="confirmPassword" placeholder="Repeat password"
                    required>
                </div>
                <button class="btn btn-primary px-4" type="submit">Create Account</button>
<!-- <a href="/home" class="btn btn-primary px-4"> Continue to Homepage </a> -->
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="vendors/@coreui/coreui/js/coreui.bundle.min.js"></script>
  <script src="vendors/simplebar/js/simplebar.min.js"></script>
</body>

</html>
